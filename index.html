<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFF3D6">
<title>Юный инвестор</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sky" aria-hidden="true"><div id="skyN"></div><div id="stars"></div><div class="cl" style="top:130px;animation-delay:-8s"></div><div class="cl" style="top:270px;animation-delay:-26s"></div><div id="sun"></div><div id="moon"></div></div>
<div id="app">
  <header id="bar">
    <div class="bar-actions">
      <button id="btnBack" class="back-btn" type="button" hidden><span aria-hidden="true">‹</span> Назад</button>
      <button id="btnSound" class="icon-btn" type="button" aria-pressed="false" aria-label="Включить звук">🔇</button>
    </div>
    <div id="dots" aria-hidden="true"></div>
    <div id="corner" aria-live="polite"></div>
  </header>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<noscript>Для игры нужен JavaScript.</noscript>
<script src="default-content.js"></script>
<script src="game.js"></script>
</body>
</html>
